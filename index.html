<title>FF sensitivity UZ</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090a0f;--card:#13151d;--ink:#eef1f8;--mut:#98a0b3;--line:#262a38;--acc:#ff2e3b;--acc2:#4d8dff;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(500px 260px at 0 0,#ff2e3b2e,transparent),radial-gradient(500px 260px at 100% 0,#2d7bff2e,transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 30px/1.05 "Chakra Petch",system-ui,sans-serif;margin:0;letter-spacing:.5px}
h1 span{color:var(--acc)}
.by{color:var(--mut);font-size:13px;margin-top:6px}
.by b{color:var(--ink)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
.tabs{display:flex;gap:8px;margin:22px 0 16px}
.tab{flex:1;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:700 16px "Chakra Petch",system-ui,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h2{font:700 20px "Chakra Petch",system-ui,sans-serif;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big{min-height:84px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:700 26px "Chakra Petch",system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big small{font:500 13px system-ui,sans-serif;color:var(--mut)}
.big:hover{border-color:var(--acc)}
.back{background:none;border:0;color:var(--acc2);font:600 15px inherit;cursor:pointer;padding:8px 0;min-height:44px}
.lay{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.lay svg{width:100%;height:auto;display:block;border-radius:6px;background:#0d1117}
.codebar{display:flex;gap:8px;align-items:center;margin-top:10px}
.code{flex:1;font:600 16px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:nowrap}
.cp{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--acc);color:var(--onacc);font:700 15px system-ui,sans-serif;cursor:pointer}
.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.brand{min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 15px system-ui,sans-serif;cursor:pointer}
.brand[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.sel{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.sel label{font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
td:last-child{text-align:right;font:700 20px "Chakra Petch",system-ui,sans-serif;color:var(--acc)}
.note{color:var(--mut);font-size:13px;margin-top:10px}
footer{margin:28px 0 8px;color:var(--mut);font-size:13px;text-align:center}
.himg{width:100%;display:block;border-radius:6px;margin-bottom:12px}
.tab,.big,.brand,.cp{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.brand{font-size:14px;padding:6px}
.crumb{color:var(--acc2);font-size:14px;min-height:20px;margin:8px 0}
.vr small{color:var(--mut);font-weight:400}
.ad{position:fixed;inset:0;z-index:9;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px}
.adbox{width:100%;max-width:360px;text-align:center;background:var(--card);border:2px solid var(--acc2);padding:20px}
.adn{font:700 54px "Chakra Petch",sans-serif;color:var(--acc)}
.adslot{height:140px;margin:12px 0;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.cp:disabled{opacity:.4}
[hidden]{display:none!important}
</style>
</head>
