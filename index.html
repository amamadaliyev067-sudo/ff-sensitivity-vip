.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td{padding:11px 14px;border-bottom:1px solid var(--line)}

.note{color:var(--mut);font-size:13px;margin-top:10px}
footer{margin:28px 0 8px;color:var(--mut);font-size:13px;text-align:center}
.himg{width:100%;display:block;border-radius:6px;margin-bottom:12px}

.crumb{color:var(--acc2);font-size:14px;min-height:20px;margin:8px 0}
